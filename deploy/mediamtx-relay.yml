# FRAME 인터넷 중계 서버용 MediaMTX 1.21.3 설정 (deploy/README.md 참고).
#
# 역할: Windows 송출 앱(송출 PC마다 자기 계정)이 RTSPS로 원본 한 개(H.264 High, B프레임 없음, 1초 GOP + Opus)를 올리고,
# 브라우저는 server/relay.mjs(HTTPS는 앞단 Caddy)를 통해서만 WebRTC(WHEP)·LL-HLS·DVR을 받는다.
#
# 공개되는 포트는 RTSPS(송출)와 WebRTC ICE(UDP/TCP 8189)뿐이다. API·playback·metrics·HLS·WebRTC 협상 HTTP와
# 평문 RTSP는 127.0.0.1에만 열고, 브라우저 요청은 relay.mjs가 검사한 뒤 루프백으로 넘긴다.
#
# 비밀 값은 이 파일에 넣지 않는다. 환경변수가 같은 이름의 설정을 덮어쓴다(MediaMTX 기능):
#   MTX_AUTHINTERNALUSERS_1_PASS, _2_PASS ...  송출 PC별 계정 비밀번호 (sha256:BASE64 해시, deploy/mediamtx.env.example)
#   MTX_WEBRTCADDITIONALHOSTS      서버 공인 IP/호스트 이름 (쉼표 구분)
#   MTX_RTSPSERVERKEY / MTX_RTSPSERVERCERT  RTSPS 인증서 경로
# 환경변수를 빠뜨리면 아래 자리표시 해시(원문 없음) 때문에 그 계정의 송출이 거부된다(열린 채로 시작하지 않음).

logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s
# 시청자(리더)별 송신 대기열. 순간 혼잡을 흡수하되 느린 시청자 한 명이 메모리를 키우지 않도록 제한한다.
writeQueueSize: 1024
udpMaxPayloadSize: 1200

authMethod: internal
authInternalUsers:
  # 0: 이 서버 안의 프로세스만(relay.mjs, 화질별 공유 인코더). 익명 시청은 relay.mjs를 거친 루프백 요청으로만 가능하다.
  #    WebRTC/HLS의 trustedProxies를 비워 두므로 MediaMTX는 모든 시청 요청을 127.0.0.1로 보고, 외부에서 RTSP로 직접
  #    읽기·송출하는 길은 없다. 원본 경로(하위 경로가 없는 이름)에는 이 계정도 송출할 수 없다.
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: publish
        path: '~^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}/((240|360|480|720|1080|1440)p|aac)$'

  # 1부터: 송출 PC마다 계정 하나. 각 계정은 자기 경로와(선택) 그 PC가 직접 만든 하위 화질 경로에만 송출할 수 있어서,
  # 다른 송출 PC의 비밀번호로는 남의 경로를 쓸 수 없다(원래 송출 PC가 재연결하는 사이에도 가로챌 수 없음).
  # 비밀번호 해시는 mediamtx.env의 MTX_AUTHINTERNALUSERS_<번호>_PASS. 송출 PC를 늘리면 같은 형식으로 항목을 추가하고,
  # relay.env 토큰 파일에서 그 PC의 토큰에 같은 경로를 준다(deploy/README.md 5·6장). 사용자 이름과 경로는 비밀이 아니다.
  - user: frame-sender-01
    pass: "sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    ips: []
    permissions:
      - action: publish
        path: '~^screen-01(/(240|360|480|720|1080|1440)p)?$'
  - user: frame-sender-02
    pass: "sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    ips: []
    permissions:
      - action: publish
        path: '~^screen-02(/(240|360|480|720|1080|1440)p)?$'

api: true
apiAddress: 127.0.0.1:9997
apiTrustedProxies: []
metrics: true
metricsAddress: 127.0.0.1:9998
pprof: false

# DVR 녹화 조회·잘라 받기. relay.mjs만 접근한다.
playback: true
playbackAddress: 127.0.0.1:9996
playbackAllowOrigins: []

# 송출 입력. 인터넷에서는 RTSPS(TLS)만 받는다. 평문 RTSP는 루프백 전용(서버 안의 화질 인코더가 원본을 읽는 용도).
rtsp: true
rtspTransports: [tcp]
rtspEncryption: "optional"
rtspAddress: 127.0.0.1:8554
rtspsAddress: :8322
rtpAddress: 127.0.0.1:8000
rtcpAddress: 127.0.0.1:8001
rtspServerKey: /etc/frame-relay/tls/rtsps.key
rtspServerCert: /etc/frame-relay/tls/rtsps.crt
rtspAuthMethods: [basic]

rtmp: false
srt: false
moq: false

# LL-HLS: WebRTC를 쓸 수 없는 단말(UDP/TCP 8189 차단 회사망 등)용 대체 경로. relay.mjs가 /<path>/hls/*로 중계한다.
hls: true
hlsAddress: 127.0.0.1:8888
hlsEncryption: false
hlsAllowOrigins: []
hlsTrustedProxies: []
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsMuxerCloseAfter: 60s

# WebRTC: 협상(WHEP) HTTP는 루프백, 미디어는 UDP 8189 우선 + TCP 8189 대체.
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: false
webrtcAllowOrigins: []
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# 클라우드 VM의 사설 인터페이스 주소를 브라우저에 광고하지 않는다. 공인 주소는 MTX_WEBRTCADDITIONALHOSTS로 넣는다.
webrtcIPsFromInterfaces: false
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []
webrtcICEServers2: []
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s

pathDefaults:
  source: publisher
  # 같은 경로에 두 번째 송출이 들어오면 기존 송출을 끊지 않고 거부한다(같은 계정이어도). 다른 송출 PC 계정은 위
  # 권한 때문에 남의 경로에 처음부터 송출할 수 없다.
  overridePublisher: false
  maxReaders: 0
  record: false

paths:
  # 원본 경로: 방송 전체를 재인코딩 없이 녹화(DVR). 1초 조각으로 기록되어 DVR 실시간 끝이 약 1초 뒤에 따라온다.
  # 경로는 방송마다 재사용되므로 relay.mjs가 현재 방송 이전 구간을 목록·조각 요청에서 가린다.
  '~^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$':
    record: true
    recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f%z
    recordFormat: fmp4
    recordPartDuration: 1s
    recordMaxPartSize: 100M
    recordSegmentDuration: 60s
    # 보존 6시간(8 Mbps 기준 시간당 약 3.6 GB). 디스크에 맞춰 조정하고, 더 긴 방송은 앞부분부터 DVR에서 사라진다.
    recordDeleteAfter: 6h

  # 서버 측 화질별 공유 인코더(선택). 시청자가 한 명이라도 볼 때만 화질마다 FFmpeg 하나가 돌고, 그 화질의 모든
  # 시청자가 공유한다. 원본 FPS를 유지하고 1초마다 키프레임을 넣는다. CPU가 부족한 무료 VM에서는 relay.env의
  # RELAY_RENDITIONS를 비워 두면 브라우저에 광고되지 않는다(경로 정의만으로는 아무 것도 실행되지 않음).
  '~^([a-zA-Z0-9][a-zA-Z0-9_-]{0,63})/720p$':
    runOnDemand: ffmpeg -hide_banner -nostdin -loglevel warning -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/$G1 -map 0:v:0 -map 0:a? -vf scale=-2:720:flags=bilinear -c:v libx264 -preset veryfast -tune zerolatency -profile:v high -bf 0 -pix_fmt yuv420p -force_key_frames expr:gte(t,n_forced*1) -b:v 3500k -maxrate 3500k -bufsize 3500k -c:a copy -f rtsp -rtsp_transport tcp -pkt_size 1190 rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 15s
  '~^([a-zA-Z0-9][a-zA-Z0-9_-]{0,63})/480p$':
    runOnDemand: ffmpeg -hide_banner -nostdin -loglevel warning -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/$G1 -map 0:v:0 -map 0:a? -vf scale=-2:480:flags=bilinear -c:v libx264 -preset veryfast -tune zerolatency -profile:v high -bf 0 -pix_fmt yuv420p -force_key_frames expr:gte(t,n_forced*1) -b:v 1800k -maxrate 1800k -bufsize 1800k -c:a copy -f rtsp -rtsp_transport tcp -pkt_size 1190 rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 15s
  '~^([a-zA-Z0-9][a-zA-Z0-9_-]{0,63})/360p$':
    runOnDemand: ffmpeg -hide_banner -nostdin -loglevel warning -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/$G1 -map 0:v:0 -map 0:a? -vf scale=-2:360:flags=bilinear -c:v libx264 -preset veryfast -tune zerolatency -profile:v high -bf 0 -pix_fmt yuv420p -force_key_frames expr:gte(t,n_forced*1) -b:v 900k -maxrate 900k -bufsize 900k -c:a copy -f rtsp -rtsp_transport tcp -pkt_size 1190 rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 15s

  # iPhone Safari 기본 HLS용 AAC 변환(선택, RELAY_HLS_AAC=1). 영상은 복사하고 음성만 Opus→AAC로 바꾼다.
  '~^([a-zA-Z0-9][a-zA-Z0-9_-]{0,63})/aac$':
    runOnDemand: ffmpeg -hide_banner -nostdin -loglevel warning -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/$G1 -map 0:v:0 -map 0:a? -c:v copy -c:a aac -b:a 128k -ar 48000 -f rtsp -rtsp_transport tcp -pkt_size 1190 rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s
