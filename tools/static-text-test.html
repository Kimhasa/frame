<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FRAME 정적 글자 테스트</title>
<style>
  html, body { margin: 0; background: #fff; color: #1d2329; font: 400 13px/1.45 "Malgun Gothic", system-ui, sans-serif; overflow: hidden; }
  main { columns: 3; column-gap: 28px; padding: 18px 24px; }
  h2 { font-size: 15px; margin: 0 0 6px; } p { margin: 0 0 10px; } table { border-collapse: collapse; width: 100%; margin-bottom: 12px; font: 12px/1.3 Consolas, monospace; }
  td, th { border: 1px solid #c8d0d8; padding: 2px 5px; text-align: right; } th { background: #eef2f5; }
</style>
</head>
<body>
<main id="m"></main>
<script>
  // Storage measurement source: a dense, completely static document (no animation, no caret) for the static-screen case.
  const words = '운영 화면 송출 수신 기록 상태 확인 네트워크 지연 프레임 비트레이트 인코더 녹화 구간 채팅 사용자 시스템 오디오 마이크 모니터 해상도 품질 설정 서버 목록 보관 정책 용량 경고 오류 복구 재시작 frame bitrate encoder keyframe segment playback latency viewer sender recording storage policy'.split(' ');
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const m = document.getElementById('m');
  for (let s = 0; s < 18; s++) {
    const h = document.createElement('h2'); h.textContent = (s + 1) + '. ' + words[Math.floor(rnd() * words.length)] + ' ' + words[Math.floor(rnd() * words.length)]; m.append(h);
    for (let p = 0; p < 2; p++) { const el = document.createElement('p'); el.textContent = Array.from({ length: 48 }, () => words[Math.floor(rnd() * words.length)]).join(' ') + '.'; m.append(el); }
    if (s % 3 === 0) { const t = document.createElement('table'); t.innerHTML = '<tr><th>항목</th><th>값</th><th>최대</th><th>평균</th></tr>' + Array.from({ length: 5 }, (_, i) => '<tr><td>' + words[i + s] + '</td><td>' + (rnd() * 1000).toFixed(2) + '</td><td>' + (rnd() * 9999).toFixed(1) + '</td><td>' + (rnd() * 100).toFixed(3) + '</td></tr>').join(''); m.append(t); }
  }
</script>
</body>
</html>
