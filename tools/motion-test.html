<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>FRAME 모션 테스트</title>
<style>
  html, body { margin: 0; height: 100%; background: #101820; color: #e8eef3; font: 600 28px/1.3 system-ui, sans-serif; overflow: hidden; }
  #bar { position: absolute; top: 34%; left: 0; width: 6%; height: 22%; background: #22d581; }
  #flash { position: absolute; right: 2%; top: 4%; width: 12%; height: 18%; background: #000; }
  #info { position: absolute; left: 3%; top: 4%; white-space: pre; }
  #code { position: absolute; left: 0; right: 0; top: 66%; height: 14%; display: flex; }
  #code i { flex: 1; }
</style>
</head>
<body>
<div id="info"></div><div id="bar"></div><div id="flash"></div><div id="code"></div>
<script>
  // Measurement source. Every displayed frame carries its render time as a barcode across the full width:
  // 4 marker cells (white, black, white, black) then 12 bits of Date.now() % 4000, most significant first.
  // Once per second a white flash and a 1 kHz beep start together (A/V offset). A bar moves every frame.
  const info = document.getElementById('info'), bar = document.getElementById('bar'), flash = document.getElementById('flash'), code = document.getElementById('code');
  const cells = Array.from({ length: 16 }, () => code.appendChild(document.createElement('i')));
  let frames = 0, last = performance.now(), fps = 0, audio = null, lastSecond = -1;
  function beep() {
    if (!audio) return;
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.frequency.value = 1000; gain.gain.value = 0.3; osc.connect(gain).connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + 0.1);
  }
  function frame(now) {
    frames++;
    if (now - last >= 1000) { fps = frames * 1000 / (now - last); frames = 0; last = now; }
    const t = Date.now(), second = Math.floor(t / 1000), stamp = t % 4000;
    bar.style.transform = 'translateX(' + ((t % 2000) / 2000 * (94 / 6) * 100) + '%)';
    flash.style.background = t % 1000 < 100 ? '#fff' : '#000';
    if (second !== lastSecond) { lastSecond = second; beep(); }
    cells.forEach((cell, i) => { const bit = i < 4 ? (i % 2 === 0 ? 1 : 0) : (stamp >> (15 - i)) & 1; cell.style.background = bit ? '#fff' : '#000'; });
    info.textContent = new Date(t).toISOString().slice(11, 23) + '\n' + 'display ' + fps.toFixed(0) + ' fps\n' + (audio ? 'beep on' : 'click to enable beep');
    requestAnimationFrame(frame);
  }
  addEventListener('click', () => { if (!audio) audio = new AudioContext(); });
  try { const a = new AudioContext(); if (a.state === 'running') audio = a; } catch {}
  requestAnimationFrame(frame);
</script>
</body>
</html>
